<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Recipe — Pixel Kitchen</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#140f1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="menu.js"></script>
<script src="dishes.js"></script>
<script src="shared.js"></script>
<style>
/* Purple/Gold/Pink palette — matches Hub & Collection */
* { margin:0; padding:0; box-sizing:border-box; image-rendering:pixelated; }
body { background:radial-gradient(ellipse at 50% 30%,#1e1630 0%,#0d0a16 100%); font-family:'Press Start 2P',monospace; width:100vw; height:100vh; overflow:hidden; color:#ffd97d; }
#rcWrap { position:fixed; top:50%; left:50%; transform-origin:center center; width:1100px; height:620px; transform:translate(-50%,-50%); display:flex; flex-direction:column; }

.rc-topbar { flex-shrink:0; display:flex; align-items:center; padding:10px 14px 6px; gap:12px; }
.rc-topbar-brand { font-size:1rem; letter-spacing:3px; color:#ffd97d; text-shadow:2px 2px #3a1a4e, 0 0 20px #c87eb8; flex:1; }
.rc-topbar-coins { color:#ffd97d; font-size:.72rem; }
.rc-topbar-lbl { color:#a890c0; font-size:.42rem; }

.rc-body { flex:1; display:flex; gap:18px; padding:10px 24px 20px; min-height:0; }

.rc-left { width:340px; display:flex; flex-direction:column; gap:12px; flex-shrink:0; }
.rc-sprite-box { background:#140f1e; border:4px solid #c87eb8; padding:16px; display:flex; align-items:center; justify-content:center; aspect-ratio:1; box-shadow:inset 0 0 0 1px #1e1630; }
.rc-sprite { width:100%; max-width:280px; aspect-ratio:1; }
.rc-name { font-size:.90rem; letter-spacing:2px; color:#ffd97d; text-align:center; text-shadow:2px 2px #3a1a4e; line-height:1.4; }
.rc-cuisine { font-size:.42rem; color:#ff8fb0; text-align:center; letter-spacing:2px; }
.rc-meta-row { display:flex; gap:8px; justify-content:center; }
.rc-meta-chip { flex:1; background:#1e1630; border:2px solid #5c3a78; padding:8px; text-align:center; }
.rc-meta-val { font-size:.60rem; color:#ffd97d; }
.rc-meta-lbl { font-size:.36rem; color:#c0a8d4; margin-top:4px; letter-spacing:1px; }

.rc-back { padding:11px 16px; background:#1e1630; border:2px solid #c87eb8; color:#ffd97d; font-family:'Press Start 2P',monospace; font-size:.50rem; cursor:pointer; transition:all .12s; letter-spacing:2px; }
.rc-back:hover { border-color:#ff8fb0; background:#271d3c; }

.rc-right { flex:1; display:flex; flex-direction:column; gap:10px; min-height:0; }

.rc-section-title { font-size:.56rem; letter-spacing:3px; color:#ffd97d; padding:7px 2px; border-bottom:2px solid #c87eb8; flex-shrink:0; }
.rc-desc { font-size:.50rem; line-height:2; color:#ffe890; padding:10px 4px; }

.rc-scroll { flex:1; overflow-y:auto; padding-right:6px; min-height:0; }
.rc-scroll::-webkit-scrollbar { width:5px; }
.rc-scroll::-webkit-scrollbar-thumb { background:#5c3a78; }

.rc-ing-list { display:flex; flex-direction:column; gap:4px; margin:4px 0 12px; }
.rc-ing-item { font-size:.48rem; color:#ffe890; padding:7px 10px; background:#1e1630; border-left:3px solid #ff8fb0; line-height:1.6; }

.rc-step-list { display:flex; flex-direction:column; gap:6px; margin:4px 0; }
.rc-step-item { font-size:.48rem; color:#ffffff; padding:9px 12px; background:#1e1630; border:2px solid #5c3a78; display:flex; gap:10px; align-items:flex-start; line-height:1.8; }
.rc-step-num { color:#ffd97d; font-size:.56rem; flex-shrink:0; min-width:20px; }

.rc-empty { text-align:center; padding:60px 20px; color:#c0a8d4; font-size:.52rem; line-height:2.2; }

#rotateMsg { display:none; position:fixed; inset:0; z-index:99999; background:#0d0a16; flex-direction:column; align-items:center; justify-content:center; gap:24px; }
@media (orientation:portrait) { #rotateMsg { display:flex; } }
.rotate-phone { font-size:52px; }
.rotate-text { color:#ffd97d; font-size:.50rem; letter-spacing:2px; text-align:center; line-height:2.4; }
.rotate-sub  { color:#a890c0; font-size:.32rem; letter-spacing:2px; }
</style>
</head>
<body>
<div id="rcWrap">
  <div class="rc-topbar">
    <span class="rc-topbar-brand">★ PIXEL KITCHEN ★</span>
    <span class="rc-topbar-coins">🪙 <span id="topbarCoins">0</span></span>
    <span class="rc-topbar-lbl">COINS</span>
  </div>

  <div class="rc-body" id="rcBody">
    <div class="rc-empty" id="rcEmpty" style="display:none;">
      Dish not found.<br><br>
      <button class="rc-back" onclick="goTo('collection.html')">◀ BACK TO COLLECTION</button>
    </div>
  </div>
</div>

<div id="rotateMsg">
  <span class="rotate-phone">📱</span>
  <div class="rotate-text">ROTATE YOUR<br>DEVICE</div>
  <div class="rotate-sub">LANDSCAPE MODE ONLY</div>
</div>

<script>
function scaleWrap(){
  const vw=window.visualViewport?window.visualViewport.width:window.innerWidth;
  const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  const wrap=document.getElementById('rcWrap');
  const scale=Math.min((vw-8)/1100,(vh-8)/620);
  wrap.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
function checkRotate(){
  const vw=window.visualViewport?window.visualViewport.width:window.innerWidth;
  const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  document.getElementById('rotateMsg').style.display=(vw<vh)?'flex':'';
}
function onResize(){ scaleWrap(); checkRotate(); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', ()=>setTimeout(onResize,100));
if(window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

function refreshCoins(){
  const el = document.getElementById('topbarCoins');
  if(el) el.textContent = localStorage.getItem('pkCoins') || 0;
}

function getDishId(){
  const p = new URLSearchParams(location.search);
  return p.get('id');
}

function renderRecipe(){
  const id = getDishId();
  const dish = PK_DISHES.find(d => d.id === id);
  const recipe = PK_DISH_RECIPES[id];
  if(!id || !dish || !recipe){
    document.getElementById('rcEmpty').style.display = 'block';
    return;
  }
  if(!pkIsDishUnlocked(id)){
    document.getElementById('rcBody').innerHTML =
      '<div class="rc-empty">This dish is locked.<br>Play the games to unlock it!<br><br>' +
      '<button class="rc-back" onclick="goTo(\'collection.html\')">◀ BACK TO COLLECTION</button></div>';
    return;
  }

  const unlockTs = pkGetCollection()[id];
  const unlockDate = unlockTs ? new Date(unlockTs).toLocaleDateString('en-US',
    {month:'short', day:'numeric', year:'numeric'}).toUpperCase() : '—';

  // Build layout
  const body = document.getElementById('rcBody');
  body.innerHTML = `
    <div class="rc-left">
      <div class="rc-sprite-box">
        <canvas class="rc-sprite" id="rcSprite" width="160" height="160"></canvas>
      </div>
      <div class="rc-name">${dish.name}</div>
      <div class="rc-cuisine">${dish.cuisine.toUpperCase()}</div>
      <div class="rc-meta-row">
        <div class="rc-meta-chip">
          <div class="rc-meta-val">⏱ ${recipe.cookTime}m</div>
          <div class="rc-meta-lbl">COOK TIME</div>
        </div>
        <div class="rc-meta-chip">
          <div class="rc-meta-val">${dish.items.length}</div>
          <div class="rc-meta-lbl">ITEMS</div>
        </div>
      </div>
      <div class="rc-meta-chip" style="padding:6px;">
        <div class="rc-meta-val" style="font-size:.38rem;">🔓 ${unlockDate}</div>
        <div class="rc-meta-lbl">UNLOCKED</div>
      </div>
      <button class="rc-back" onclick="goTo('collection.html')">◀ COLLECTION</button>
    </div>

    <div class="rc-right">
      <div class="rc-section-title">▶ ABOUT</div>
      <div class="rc-desc">${recipe.description}</div>
      <div class="rc-scroll">
        <div class="rc-section-title">▶ INGREDIENTS</div>
        <div class="rc-ing-list">
          ${recipe.realIngredients.map(ing => `<div class="rc-ing-item">• ${ing}</div>`).join('')}
        </div>
        <div class="rc-section-title">▶ HOW TO COOK</div>
        <div class="rc-step-list">
          ${recipe.steps.map((s,i) => `<div class="rc-step-item"><span class="rc-step-num">${i+1}.</span><span>${s}</span></div>`).join('')}
        </div>
      </div>
    </div>
  `;

  // Draw sprite
  const canvas = document.getElementById('rcSprite');
  if(canvas){
    const ctx = canvas.getContext('2d');
    pkLoadDishImage().then(() => {
      pkDrawDishSprite(ctx, id, 0, 0, 160);
    }).catch(e => console.warn('dish sprite load failed', e));
  }
}

document.addEventListener('DOMContentLoaded', () => {
  onResize();
  refreshCoins();
  renderRecipe();
});
</script>
</body>
</html>
