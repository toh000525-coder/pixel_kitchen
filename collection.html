<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Collection — Pixel Kitchen</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#140f1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="menu.js"></script>
<script src="dishes.js"></script>
<script src="shared.js"></script>
<style>
/* ═══ Purple/Gold/Pink palette — matches Hub & Splash ═══
   bg-deep    #0d0a16   deepest
   bg         #140f1e   main page bg
   bg2        #1e1630   elevated panel
   bg3        #271d3c   card hover / active bg
   border     #5c3a78   primary border (purple)
   border-hi  #c87eb8   highlight border (pink)
   gold       #ffd97d   main text (gold)
   pink       #ff8fb0   accent
   sub        #a890c0   secondary text (brighter than hub's #7a5a8a for readability)
*/
* { margin:0; padding:0; box-sizing:border-box; image-rendering:pixelated; }
body { background:radial-gradient(ellipse at 50% 30%,#1e1630 0%,#0d0a16 100%); font-family:'Press Start 2P',monospace; width:100vw; height:100vh; overflow:hidden; color:#ffd97d; }
#colWrap { position:fixed; top:50%; left:50%; transform-origin:center center; width:1100px; height:620px; transform:translate(-50%,-50%); display:flex; flex-direction:column; }

.col-topbar { flex-shrink:0; background:transparent; display:flex; align-items:center; padding:10px 14px 6px; gap:12px; }
.col-topbar-brand { font-size:1rem; letter-spacing:3px; color:#ffd97d; text-shadow:2px 2px #3a1a4e, 0 0 20px #c87eb8; flex:1; }
.col-topbar-coins { color:#ffd97d; font-size:.72rem; }
.col-topbar-lbl { color:#a890c0; font-size:.42rem; }

.col-body { flex:1; display:flex; flex-direction:column; min-height:0; padding:10px 24px 20px; gap:12px; }

.col-header { display:flex; align-items:center; gap:18px; }
.col-title { font-size:.82rem; letter-spacing:3px; color:#ffd97d; text-shadow:2px 2px #3a1a4e; }
.col-title span { font-size:1.4rem; margin-right:8px; }
.col-progress { flex:1; display:flex; flex-direction:column; gap:5px; }
.col-progress-top { display:flex; justify-content:space-between; align-items:baseline; }
.col-progress-lbl { font-size:.46rem; color:#ff8fb0; letter-spacing:2px; }
.col-progress-count { font-size:.68rem; color:#ffd97d; letter-spacing:2px; }
.col-progress-bar { height:12px; background:#140f1e; border:2px solid #c87eb8; position:relative; }
.col-progress-fill { height:100%; background:linear-gradient(90deg,#ff8fb0,#ffd97d); transition:width .4s ease; }

.col-back { padding:10px 16px; background:#1e1630; border:2px solid #c87eb8; color:#ffd97d; font-family:'Press Start 2P',monospace; font-size:.50rem; cursor:pointer; transition:all .12s; letter-spacing:2px; }
.col-back:hover { border-color:#ff8fb0; background:#271d3c; }

.col-tabs { display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0; }
.cuisine-tab { padding:10px 12px; background:#1e1630; border:2px solid #5c3a78; color:#c0a8d4; font-family:'Press Start 2P',monospace; font-size:.46rem; letter-spacing:1px; cursor:pointer; transition:all .12s; min-height:36px; display:inline-flex; align-items:center; gap:6px; touch-action:manipulation; }
.cuisine-tab:hover { color:#ffd97d; border-color:#c87eb8; background:#271d3c; }
.cuisine-tab.active { background:#271d3c; border-color:#ffd97d; color:#ffe890; box-shadow:0 0 12px rgba(255,217,125,0.4); }
.cuisine-tab .tab-count { font-size:.38rem; color:#ff8fb0; letter-spacing:0; padding:2px 5px; background:#140f1e; border-radius:2px; }
.cuisine-tab.active .tab-count { color:#ffd97d; }
.cuisine-tab.complete .tab-count { color:#50c840; background:#0a1e0a; }

.col-sort-row { display:flex; gap:6px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
.col-sort-lbl { font-size:.40rem; color:#a890c0; letter-spacing:1.5px; padding:0 4px; }
.sort-btn { padding:7px 10px; background:#1e1630; border:2px solid #5c3a78; color:#c0a8d4; font-family:'Press Start 2P',monospace; font-size:.40rem; letter-spacing:1px; cursor:pointer; transition:all .12s; touch-action:manipulation; }
.sort-btn:hover { color:#ffd97d; border-color:#c87eb8; }
.sort-btn.active { background:#271d3c; border-color:#ffd97d; color:#ffd97d; }

.dish-grid-wrap { flex:1; overflow-y:auto; border:3px solid #5c3a78; background:#140f1e; padding:16px; box-shadow:inset 0 0 0 1px #1e1630; min-height:0; }
.dish-grid-wrap::-webkit-scrollbar { width:6px; }
.dish-grid-wrap::-webkit-scrollbar-thumb { background:#5c3a78; }
.dish-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:14px; }

.dish-card { background:#271d3c; border:3px solid #c87eb8; padding:12px 8px; text-align:center; cursor:pointer; transition:all .15s; position:relative; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
.dish-card.unlocked:active { transform:translateY(1px) scale(0.98); }
.dish-card.unlocked:hover { border-color:#ffd97d; transform:translateY(-2px); box-shadow:0 4px 0 #140f1e, 0 0 14px rgba(255,217,125,0.35); }
.dish-card.locked { cursor:default; background:#1e1630; border-color:#5c3a78; }
.dish-card.locked .dish-sprite { filter:brightness(0) opacity(.70); }

/* Reveal animation for cards unlocked within the last 60s */
.dish-card.just-unlocked {
  animation: pkCardReveal .75s cubic-bezier(.34,1.56,.64,1);
  border-color:#ffd97d;
  box-shadow:0 0 20px rgba(255,217,125,0.6);
}
.dish-card.just-unlocked .dish-sprite {
  animation: pkSpriteSparkle 1.4s ease-out;
}
@keyframes pkCardReveal {
  0%   { transform:scale(0) rotate(-12deg); opacity:0; }
  55%  { transform:scale(1.12) rotate(4deg); opacity:1; }
  100% { transform:scale(1) rotate(0); opacity:1; }
}
@keyframes pkSpriteSparkle {
  0%, 100% { filter:none; }
  30%      { filter:brightness(1.7) drop-shadow(0 0 10px #ffd97d); }
  65%      { filter:brightness(1.3) drop-shadow(0 0 14px #ff8fb0); }
}

.dish-sprite { width:108px; height:108px; margin:0 auto 8px; display:block; }

.dish-name { font-size:.52rem; letter-spacing:1.5px; color:#ffd97d; line-height:1.4; min-height:2em; }
.dish-card.locked .dish-name { color:#c0a8d4; }
.dish-card.locked .dish-name::after { content:' ???'; color:#ff8fb0; }
.dish-card.locked .real-name { display:none; }

.dish-cuisine { font-size:.38rem; color:#ff8fb0; margin-top:4px; letter-spacing:1.5px; }
.dish-card.locked .dish-cuisine { visibility:hidden; }

.dish-new { position:absolute; top:4px; right:4px; font-size:.36rem; padding:3px 6px; background:#ff3377; color:#fff; letter-spacing:1px; animation:pkPulse 1.2s ease-in-out infinite; }
@keyframes pkPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

.col-empty-msg { text-align:center; padding:40px; color:#c0a8d4; font-size:.52rem; line-height:2.2; }

#rotateMsg { display:none; position:fixed; inset:0; z-index:99999; background:#0d0a16; flex-direction:column; align-items:center; justify-content:center; gap:24px; }
@media (orientation:portrait) { #rotateMsg { display:flex; } }
.rotate-phone { font-size:52px; }
.rotate-text { color:#ffd97d; font-size:.50rem; letter-spacing:2px; text-align:center; line-height:2.4; }
.rotate-sub  { color:#a890c0; font-size:.32rem; letter-spacing:2px; }

/* ── Recipe Modal ──────────────────────────────────── */
#recipeModal { display:none; position:fixed; inset:0; z-index:9000; background:rgba(13,10,22,.85); backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:24px; animation:modalIn .2s ease-out; }
#recipeModal.visible { display:flex; }
@keyframes modalIn { from{opacity:0} to{opacity:1} }
.modal-box { width:100%; max-width:920px; max-height:90vh; background:#1e1630; border:4px solid #c87eb8; box-shadow:6px 6px 0 #0d0a16, 0 0 60px rgba(200,126,184,0.25); display:flex; flex-direction:column; position:relative; overflow:hidden; animation:modalPop .25s cubic-bezier(.34,1.56,.64,1); }
@keyframes modalPop { from{transform:scale(0.9);opacity:0} to{transform:scale(1);opacity:1} }
.modal-close { position:absolute; top:10px; right:12px; z-index:10; width:36px; height:36px; background:#1e1630; border:2px solid #c87eb8; color:#ffd97d; font-family:'Press Start 2P',monospace; font-size:.70rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .12s; }
.modal-close:hover { background:#271d3c; border-color:#ffd97d; transform:rotate(90deg); }
.modal-header { background:#140f1e; padding:16px 20px; border-bottom:3px solid #5c3a78; display:flex; align-items:center; gap:18px; flex-shrink:0; position:relative; overflow:hidden; }
.modal-header::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,#ff8fb0,#ffd97d,#ff8fb0,transparent); }
.modal-sprite { width:96px; height:96px; background:#0d0a16; border:3px solid #c87eb8; padding:6px; flex-shrink:0; }
.modal-head-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.modal-name { font-size:.88rem; letter-spacing:3px; color:#ffd97d; text-shadow:2px 2px #3a1a4e; line-height:1.4; }
.modal-sub-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.modal-cuisine { font-size:.50rem; color:#ff8fb0; letter-spacing:2px; }
.modal-chip { font-size:.48rem; color:#c0a8d4; letter-spacing:1.5px; padding:6px 10px; background:#271d3c; border:1px solid #5c3a78; }
.modal-chip b { color:#ffd97d; font-weight:normal; }
.modal-body { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:16px; min-height:0; }
.modal-body::-webkit-scrollbar { width:6px; }
.modal-body::-webkit-scrollbar-thumb { background:#5c3a78; }
.modal-section { display:flex; flex-direction:column; gap:8px; }
.modal-section-title { font-size:.60rem; letter-spacing:3px; color:#ffd97d; padding:6px 0; border-bottom:2px solid #c87eb8; margin-bottom:4px; }
.modal-desc { font-size:.56rem; line-height:2; color:#ffe890; padding:4px 6px; }
.modal-ing-row { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:8px 12px; }
.modal-ing-item { font-size:.52rem; color:#ffe890; padding:10px 12px; background:#140f1e; border-left:4px solid #ff8fb0; line-height:1.7; }
.modal-step-list { display:flex; flex-direction:column; gap:8px; }
.modal-step-item { font-size:.54rem; color:#ffffff; padding:12px 14px; background:#140f1e; border:2px solid #5c3a78; display:flex; gap:14px; align-items:flex-start; line-height:1.9; }
.modal-step-num { color:#ffd97d; font-size:.64rem; flex-shrink:0; min-width:22px; }
</style>
</head>
<body>
<div id="colWrap">
  <div class="col-topbar">
    <span class="col-topbar-brand">★ PIXEL KITCHEN ★</span>
    <span class="col-topbar-coins">🪙 <span id="topbarCoins">0</span></span>
    <span class="col-topbar-lbl">COINS</span>
  </div>

  <div class="col-body">
    <div class="col-header">
      <div class="col-title"><span>📖</span>COLLECTION</div>
      <div class="col-progress">
        <div class="col-progress-top">
          <span class="col-progress-lbl">DISHES UNLOCKED</span>
          <span class="col-progress-count"><span id="unlockCount">0</span> / <span id="totalCount">—</span></span>
        </div>
        <div class="col-progress-bar"><div class="col-progress-fill" id="progressFill" style="width:0%;"></div></div>
      </div>
      <button class="col-back" onclick="goTo('0_hub.html?from=game')">◀ HUB</button>
    </div>

    <div class="col-tabs" id="tabRow"></div>

    <div class="col-sort-row">
      <span class="col-sort-lbl">SORT BY:</span>
      <button class="sort-btn active" data-sort="default" onclick="setSort('default')">🗺️ CUISINE</button>
      <button class="sort-btn" data-sort="newest" onclick="setSort('newest')">🆕 NEWEST</button>
      <button class="sort-btn" data-sort="time" onclick="setSort('time')">⏱️ COOK TIME</button>
    </div>

    <div class="dish-grid-wrap">
      <div class="dish-grid" id="dishGrid"></div>
    </div>
  </div>
</div>

<div id="recipeModal" onclick="if(event.target===this)closeRecipeModal()">
  <div class="modal-box" id="modalBox">
    <button class="modal-close" onclick="closeRecipeModal()" aria-label="Close">✕</button>
    <div class="modal-header">
      <canvas class="modal-sprite" id="modalSprite" width="160" height="160"></canvas>
      <div class="modal-head-text">
        <div class="modal-name" id="modalName"></div>
        <div class="modal-sub-row">
          <span class="modal-cuisine" id="modalCuisine"></span>
          <span class="modal-chip">⏱ <b id="modalCookTime">—</b> MIN</span>
          <span class="modal-chip">🥄 <b id="modalItems">—</b> ITEMS</span>
          <span class="modal-chip">🔓 <b id="modalUnlock">—</b></span>
        </div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="modal-section-title">▶ ABOUT</div>
        <div class="modal-desc" id="modalDesc"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">▶ INGREDIENTS</div>
        <div class="modal-ing-row" id="modalIngList"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">▶ HOW TO COOK</div>
        <div class="modal-step-list" id="modalStepList"></div>
      </div>
    </div>
  </div>
</div>

<div id="rotateMsg">
  <span class="rotate-phone">📱</span>
  <div class="rotate-text">ROTATE YOUR<br>DEVICE</div>
  <div class="rotate-sub">LANDSCAPE MODE ONLY</div>
</div>

<script>
const COLLECTION_IDS = Object.keys(PK_DISH_RECIPES);
const DISHES_INDEX = {};
PK_DISHES.forEach(d => { if(COLLECTION_IDS.includes(d.id)) DISHES_INDEX[d.id] = d; });
// Cache collection size so hub's profile can show progress without loading menu.js
try { localStorage.setItem('pkCollectionTotal', COLLECTION_IDS.length); } catch(e){}

const CUISINES = [...new Set(COLLECTION_IDS.map(id => DISHES_INDEX[id]?.cuisine).filter(Boolean))].sort();

let activeCuisine = 'ALL';
let activeSort = 'default';
const NEW_WINDOW_MS = 60000;  // "NEW" flash for dishes unlocked within this

function scaleWrap(){
  const vw=window.visualViewport?window.visualViewport.width:window.innerWidth;
  const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  const wrap=document.getElementById('colWrap');
  const scale=Math.min((vw-8)/1100,(vh-8)/620);
  wrap.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
function checkRotate(){
  const vw=window.visualViewport?window.visualViewport.width:window.innerWidth;
  const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  document.getElementById('rotateMsg').style.display=(vw<vh)?'flex':'';
}
function onResize(){ scaleWrap(); checkRotate(); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', ()=>setTimeout(onResize,100));
if(window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

function refreshCoins(){
  const el = document.getElementById('topbarCoins');
  if(el) el.textContent = localStorage.getItem('pkCoins') || 0;
}

function _countOwned(ids, collection){
  return ids.filter(id => collection[id]).length;
}

function renderTabs(){
  const row = document.getElementById('tabRow');
  const collection = pkGetCollection();
  row.innerHTML = '';

  // ALL tab — total progress
  const allOwned = _countOwned(COLLECTION_IDS, collection);
  const allBtn = document.createElement('button');
  allBtn.className = 'cuisine-tab' +
    (activeCuisine==='ALL' ? ' active' : '') +
    (allOwned === COLLECTION_IDS.length ? ' complete' : '');
  allBtn.innerHTML = `ALL <span class="tab-count">${allOwned}/${COLLECTION_IDS.length}</span>`;
  allBtn.onclick = () => { activeCuisine='ALL'; renderTabs(); renderGrid(); };
  row.appendChild(allBtn);

  // Per-cuisine tabs with progress
  CUISINES.forEach(c => {
    const ids = COLLECTION_IDS.filter(id => DISHES_INDEX[id]?.cuisine === c);
    const owned = _countOwned(ids, collection);
    const btn = document.createElement('button');
    btn.className = 'cuisine-tab' +
      (activeCuisine===c ? ' active' : '') +
      (owned === ids.length ? ' complete' : '');
    btn.innerHTML = `${c.toUpperCase()} <span class="tab-count">${owned}/${ids.length}</span>`;
    btn.onclick = () => { activeCuisine=c; renderTabs(); renderGrid(); };
    row.appendChild(btn);
  });
}

function setSort(key){
  if(activeSort === key) return;
  activeSort = key;
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.sort === key);
  });
  renderGrid();
}

function _sortVisible(ids, collection){
  const copy = ids.slice();
  if(activeSort === 'newest'){
    // Unlocked-by-unlock-time desc, then locked at the end (in original order)
    copy.sort((a, b) => {
      const ta = collection[a] || 0;
      const tb = collection[b] || 0;
      if(ta && tb) return tb - ta;
      if(ta) return -1;
      if(tb) return  1;
      return 0;
    });
  } else if(activeSort === 'time'){
    // Cook time asc; dishes with no recipe fall through last
    copy.sort((a, b) => {
      const ca = PK_DISH_RECIPES[a]?.cookTime || 9999;
      const cb = PK_DISH_RECIPES[b]?.cookTime || 9999;
      return ca - cb;
    });
  }
  // 'default' = original order (already cuisine-grouped via menu.js)
  return copy;
}

function renderGrid(){
  const grid = document.getElementById('dishGrid');
  grid.innerHTML = '';
  const collection = pkGetCollection();
  let visible = COLLECTION_IDS.filter(id => {
    const d = DISHES_INDEX[id];
    if(!d) return false;
    if(activeCuisine==='ALL') return true;
    return d.cuisine === activeCuisine;
  });
  visible = _sortVisible(visible, collection);
  if(visible.length === 0){
    grid.innerHTML = '<div class="col-empty-msg" style="grid-column:1/-1;">No dishes in this cuisine yet.</div>';
    return;
  }
  const now = Date.now();
  visible.forEach(id => {
    const d = DISHES_INDEX[id];
    const unlocked = !!collection[id];
    const isNew = unlocked && (now - collection[id]) < NEW_WINDOW_MS;
    const card = document.createElement('div');
    card.className = 'dish-card ' + (unlocked ? 'unlocked' : 'locked') + (isNew ? ' just-unlocked' : '');
    if(isNew){
      const badge = document.createElement('div');
      badge.className = 'dish-new';
      badge.textContent = 'NEW';
      card.appendChild(badge);
    }
    const canvas = document.createElement('canvas');
    canvas.className = 'dish-sprite';
    canvas.width = 160; canvas.height = 160;
    card.appendChild(canvas);
    const name = document.createElement('div');
    name.className = 'dish-name';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'real-name';
    nameSpan.textContent = d.name;
    name.appendChild(nameSpan);
    card.appendChild(name);
    const cuisineLbl = document.createElement('div');
    cuisineLbl.className = 'dish-cuisine';
    cuisineLbl.textContent = d.cuisine;
    card.appendChild(cuisineLbl);
    if(unlocked){
      card.onclick = () => { try { pkVibrate('tap'); } catch(e){} openRecipeModal(id); };
    }
    grid.appendChild(card);
    // Draw sprite into canvas
    const ctx = canvas.getContext('2d');
    if(PK_DISH_IMAGE_READY){
      pkDrawDishSprite(ctx, id, 0, 0, 160);
    }
  });
}

function openRecipeModal(id){
  const dish = DISHES_INDEX[id];
  const recipe = PK_DISH_RECIPES[id];
  if(!dish || !recipe) return;
  const unlockTs = pkGetCollection()[id];
  const unlockDate = unlockTs ? new Date(unlockTs).toLocaleDateString('en-US',
    {month:'short', day:'numeric', year:'numeric'}).toUpperCase() : '—';

  document.getElementById('modalName').textContent = dish.name;
  document.getElementById('modalCuisine').textContent = dish.cuisine.toUpperCase();
  document.getElementById('modalCookTime').textContent = recipe.cookTime;
  document.getElementById('modalItems').textContent = dish.items.length;
  document.getElementById('modalUnlock').textContent = unlockDate;
  document.getElementById('modalDesc').textContent = recipe.description;

  document.getElementById('modalIngList').innerHTML =
    recipe.realIngredients.map(ing => `<div class="modal-ing-item">• ${ing}</div>`).join('');
  document.getElementById('modalStepList').innerHTML =
    recipe.steps.map((s,i) => `<div class="modal-step-item"><span class="modal-step-num">${i+1}.</span><span>${s}</span></div>`).join('');

  // Draw sprite
  const canvas = document.getElementById('modalSprite');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(PK_DISH_IMAGE_READY){
    pkDrawDishSprite(ctx, id, 0, 0, canvas.width);
  } else {
    pkLoadDishImage().then(() => pkDrawDishSprite(ctx, id, 0, 0, canvas.width)).catch(()=>{});
  }

  document.getElementById('recipeModal').classList.add('visible');
  document.body.style.overflow = 'hidden';
}
function closeRecipeModal(){
  document.getElementById('recipeModal').classList.remove('visible');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.getElementById('recipeModal').classList.contains('visible')){
    closeRecipeModal();
  }
});

function refreshProgress(){
  const collection = pkGetCollection();
  const owned = COLLECTION_IDS.filter(id => collection[id]).length;
  const total = COLLECTION_IDS.length;
  document.getElementById('unlockCount').textContent = owned;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('progressFill').style.width = (owned/total*100) + '%';
}

document.addEventListener('DOMContentLoaded', async () => {
  onResize();
  refreshCoins();
  refreshProgress();
  renderTabs();
  renderGrid();
  try {
    await pkLoadDishImage();
    renderGrid(); // redraw now that image is ready
  } catch(e){
    console.warn('dish sprite load failed', e);
  }
});
</script>
